<!doctype html><html lang="en"><meta charset="utf-8"><title>Learning browser tests</title><body><pre id="results">RUNNING</pre><iframe src="../index.html" title="App under test" width="1200" height="900"></iframe><script>
const frame = document.querySelector('iframe');
frame.addEventListener('load', async () => {
  const w = frame.contentWindow, d = w.document, lines = [];
  const originalData = w.SAT.store.dump();
  const assert = (ok, message) => { if (!ok) throw new Error(message); lines.push('PASS ' + message); };
  const go = async (hash) => { w.location.hash = hash; await new Promise(r => setTimeout(r, 30)); assert(!d.querySelector('#view').textContent.includes('Error rendering'), 'Render ' + hash); };
  const click = (sel) => { const el = d.querySelector(sel); if (!el) throw new Error('Missing ' + sel); el.click(); };
  const answer = (value) => { d.querySelector('.practice input[name="answer"]').value = value; d.querySelector('.practice').requestSubmit(); };
  try {
    w.SAT.store.clear();
    await go('#learning'); assert(d.querySelectorAll('.learning-grid article').length === 4, 'Four learning paths');
    await go('#learn-statements'); assert(d.querySelector('[data-next]').disabled, 'Lesson starts locked');
    answer(''); assert(d.querySelector('.exercise-feedback').textContent.includes('Enter a number'), 'Blank answer rejected');
    answer('20'); assert(d.querySelector('[data-next]').disabled, 'Wrong answer does not unlock lesson');
    click('[data-hint]'); assert(!d.querySelector('[data-hint-text]').hidden, 'Hint appears');
    answer('25%'); assert(!d.querySelector('[data-next]').disabled, 'Correct answer unlocks lesson');
    click('[data-next]'); answer('40'); click('[data-next]'); answer('15'); click('[data-next]');
    await new Promise(r => setTimeout(r, 30)); assert(d.querySelector('.learning-grid').textContent.includes('3 of 3'), 'Path completion shown');
    await go('#learn-statements'); assert(!d.querySelector('[data-next]').disabled, 'Saved completion restores');
    await go('#learn-business'); answer('15'); click('[data-next]'); answer('15'); click('[data-next]'); answer('30');
    await go('#learn-valuation'); answer('15'); click('[data-next]'); answer('100'); click('[data-next]');
    click('input[value="1"]'); d.querySelector('.practice').requestSubmit(); assert(d.querySelector('[data-next]').disabled, 'Incorrect choice rejected');
    click('input[value="0"]'); d.querySelector('.practice').requestSubmit(); assert(!d.querySelector('[data-next]').disabled, 'Correct choice accepted');
    await go('#learn-owner');
    assert(d.querySelectorAll('[data-step]').length === 5, 'Owner path contains five lessons');
    answer('42.9'); assert(d.querySelector('[data-next]').disabled, 'Upside is not accepted as margin of safety');
    answer('30'); click('[data-next]'); answer('16'); click('[data-next]'); answer('25');
    assert(d.querySelector('[data-next]').textContent === 'Next lesson', 'Five-lesson path does not finish at lesson three');
    click('[data-next]'); click('input[value="0"]'); d.querySelector('.practice').requestSubmit();
    assert(d.querySelector('[data-next]').disabled, 'EPS increase alone is not value creation');
    click('input[value="1"]'); d.querySelector('.practice').requestSubmit(); click('[data-next]');
    click('input[value="0"]'); d.querySelector('.practice').requestSubmit();
    assert(d.querySelector('[data-next]').disabled, 'Missing catalyst alone is not a value trap');
    click('input[value="2"]'); d.querySelector('.practice').requestSubmit();
    assert(d.querySelector('[data-next]').textContent === 'Finish path', 'Final owner lesson finishes path');
    click('[data-next]'); await new Promise(r => setTimeout(r, 30));
    assert(d.querySelector('.learning-grid').textContent.includes('5 of 5'), 'Owner path completion shown');
    await go('#value-investing');
    assert(d.querySelectorAll('.cc').length === 20, 'Twenty value-investing cards render');
    for (const c of Object.values(w.SAT.C).filter(c => c.section === 'value-investing')) {
      assert(w.SAT.search(c.title).some(hit => hit.href === w.SAT.href(c.id)), 'Search finds ' + c.title);
      assert(c.related.every(id => w.SAT.C[id]), 'Related concepts resolve for ' + c.title);
    }
    await go('#glossary');
    assert([...d.querySelectorAll('.gl-i')].some(a => a.textContent.includes('Maintenance CapEx') && a.hash === '#value-investing/maintenance-capex'), 'Glossary points to maintenance card');
    await go('#cheatsheet');
    assert(d.querySelectorAll('[data-grp="Value Investing"] .sheet-i').length === 9, 'Value formulas included');
    await go('#statements');
    for (let i = 0; i < 3; i++) {
      click('[data-trace="' + i + '"]'); const required = [...d.querySelectorAll('.source-active input')].map(n => n.value);
      assert(required.length === 2, 'Metric ' + i + ' highlights two source figures');
      click('[data-practice]'); click('[data-check]'); assert(d.querySelector('.source-feedback').textContent.includes('Not quite'), 'Empty source selection rejected');
      required.forEach(id => click('.source-row input[value="' + id + '"]'));
      click('.source-row input[value="net-income"]'); click('[data-check]'); assert(d.querySelector('.source-feedback').textContent.includes('Not quite'), 'Extra source rejected');
      click('.source-row input[value="net-income"]'); click('[data-check]'); assert(d.querySelector('.source-feedback').textContent.includes('Correct'), 'Correct sources accepted');
    }
    for (const id of Object.keys(w.SAT.EXERCISES)) {
      await go(w.SAT.href(id)); assert(!!d.querySelector('#k-' + id + ' .practice'), id + ' has concept exercise');
    }
    await go('#company-case'); assert(!d.querySelector('#view').textContent.includes('Market capitalization'), 'Later case figures hidden');
    const note = d.querySelector('[data-reflection]'); note.value = '<img src=x onerror=alert(1)>'; note.dispatchEvent(new w.Event('input'));
    answer('40'); click('[data-next]'); assert(d.querySelector('table').textContent.includes('Capital spending'), 'Second chapter reveals cash data');
    answer('15'); click('[data-next]'); answer('15'); click('[data-next]');
    assert(d.querySelector('h2').textContent === 'Case complete', 'Case completes');
    assert(!d.querySelector('.case-note img'), 'Saved reflection is escaped');
    assert(d.querySelector('.case-note').textContent.includes('<img'), 'Reflection text preserved');
    assert(w.SAT.store.dump()['learning-results']['case:2'].passed, 'Learning results included in export');
    await go('#learning'); frame.width = '375'; await new Promise(r => setTimeout(r, 30));
    assert(d.documentElement.scrollWidth <= w.innerWidth, 'Mobile learning page fits viewport');
    await go('#statements'); assert(d.documentElement.scrollWidth <= w.innerWidth, 'Mobile statement map fits viewport');
    await go('#learn-owner'); assert(d.documentElement.scrollWidth <= w.innerWidth, 'Mobile owner lesson fits viewport');
    await go('#value-investing'); assert(d.documentElement.scrollWidth <= w.innerWidth, 'Mobile value reference fits viewport');
    lines.push('ALL PASSED');
  } catch (e) { lines.push('FAIL ' + e.stack); }
  finally { w.SAT.store.clear(); w.SAT.store.load(originalData); }
  document.querySelector('#results').textContent = lines.join('\n');
});
</script></body></html>
