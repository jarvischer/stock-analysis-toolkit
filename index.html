<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Analysis Toolkit</title>
<meta name="description" content="Interactive reference and valuation toolkit for analysing public companies: concepts, formulas, calculators, DCF, sensitivity, scenarios, SOTP, thesis and checklist.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6e5c'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script>try{var t=localStorage.getItem('sat:theme');if(t)document.documentElement.setAttribute('data-theme',JSON.parse(t));}catch(e){}</script>
</head>
<body>
<header class="top">
  <button id="menuBtn" class="iconbtn" aria-label="Open navigation">☰</button>
  <div class="brand"><div class="logo">SA</div><div>Stock Analysis Toolkit<small>Reference &amp; Valuation</small></div></div>
  <div class="sp"></div>
  <div class="toggles">
    <button class="tog" id="tLearn" aria-pressed="false" title="Show ‘What does this tell me?’ explanations"><span class="dot"></span>Learning <span class="lbl-long">Mode</span></button>
    <button class="tog" id="tForm" aria-pressed="false" title="Show formulas under calculated metrics"><span class="dot"></span>Formulas</button>
    <button class="iconbtn" id="bTheme" title="Toggle light / dark">◐</button>
    <button class="iconbtn" id="bExport" title="Download all your saved data as JSON">Export</button>
    <button class="iconbtn" id="bImport" title="Load data from a JSON export">Import</button>
    <input type="file" id="fImport" accept="application/json" hidden>
  </div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="main" tabindex="-1">
    <div class="legend" aria-label="Colour legend">
      <span><i class="l-actual"></i>Actual / historical data</span>
      <span><i class="l-assume"></i>Analyst assumption</span>
      <span><i class="l-calc"></i>Calculated metric</span>
      <span><i class="l-est"></i>Estimated valuation</span>
      <span class="muted">Inputs accept 10B · 500M · 25K. Everything you type is saved in this browser.</span>
    </div>
    <div id="view"></div>
  </main>
</div>

<script src="js/core.js"></script>
<script src="js/learn.js"></script>
<!-- Modules: each file registers one or more pages. Add new topics by adding a file here. -->
<script src="js/modules/overview.js"></script>
<script src="js/modules/business.js"></script>
<script src="js/modules/income.js"></script>
<script src="js/modules/cashflow.js"></script>
<script src="js/modules/balance.js"></script>
<script src="js/modules/efficiency.js"></script>
<script src="js/modules/valuation.js"></script>
<script src="js/modules/dcf.js"></script>
<script src="js/modules/scenarios.js"></script>
<script src="js/modules/sotp.js"></script>
<script src="js/modules/thesis.js"></script>
<script src="js/modules/checklist.js"></script>
<script src="js/modules/cheatsheet.js"></script>
<script src="js/modules/analyzer.js"></script>
<script src="js/modules/roadmap.js"></script>
<script src="js/app.js"></script>
</body>
</html>
