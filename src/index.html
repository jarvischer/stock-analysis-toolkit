<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Analysis Reference</title>
<meta name="description" content="Stock analysis handbook, formula cheat sheet and financial glossary: every core metric with formula, example, interpretation, comparisons and pitfalls.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6e5c'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
try {
  var requested = new URL(location.href).searchParams.get('lang');
  var savedLanguage = JSON.parse(localStorage.getItem('sat:language') || '"en"');
  var initialLanguage = ['en', 'he'].includes(requested) ? requested : savedLanguage;
  document.documentElement.lang = initialLanguage === 'he' ? 'he' : 'en';
  document.documentElement.dir = initialLanguage === 'he' ? 'rtl' : 'ltr';
} catch (_) {}
</script>
<!-- APP_STYLE -->
<script>try{var t=localStorage.getItem('sat:theme');if(t)document.documentElement.setAttribute('data-theme',JSON.parse(t));}catch(e){}</script>
</head>
<body>
<header class="top">
  <button id="menuBtn" class="iconbtn" aria-label="Open navigation">☰</button>
  <a class="brand" href="#framework"><div class="logo">SA</div><div>Stock Analysis Reference<small>Handbook · Cheat Sheet · Glossary</small></div></a>
  <div class="search">
    <input id="q" type="search" placeholder="Search concepts…  (ROIC, FCF, Gross Margin, EV)" autocomplete="off" spellcheck="false" aria-label="Search concepts">
    <kbd>/</kbd>
    <div id="qres" class="qres" hidden role="listbox"></div>
  </div>
  <div class="toggles">
    <button class="iconbtn" id="bLanguage" type="button" aria-label="Switch to Hebrew">עברית</button>
    <button class="tog" id="tLearn" aria-pressed="false" title="Expand “How do I interpret this?” on every card"><span class="dot"></span>Learning <span class="lbl-long">Mode</span></button>
    <button class="iconbtn" id="bTheme" title="Toggle light / dark">◐</button>
    <button class="iconbtn" id="bExport" title="Download favorites, notes and tool inputs as JSON">Export</button>
    <button class="iconbtn" id="bImport" title="Load a JSON export">Import</button>
    <input type="file" id="fImport" accept="application/json" hidden>
  </div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="main" tabindex="-1">
    <div id="view"></div>
  </main>
</div>

<!-- APP_SCRIPT -->
</body>
</html>
